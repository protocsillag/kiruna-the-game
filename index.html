<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiruna – the game</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay">
      <div class="card">
        <h1>Kiruna</h1>
        <p class="sub">Camp Alta · Swedish Lapland · January</p>
        <p id="status">Loading…</p>
        <ul class="keys">
          <li><b>WASD</b>walk</li>
          <li><b>Shift</b>jog</li>
          <li><b>Mouse</b>look</li>
          <li><b>Wheel</b>zoom</li>
          <li><b>Esc</b>pause</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
